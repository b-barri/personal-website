<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="How Literary Garden works. From the files your Kindle already keeps to a garden you visit each morning.">
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2c2c2c" stroke-opacity="0.045" stroke-width="1"/></pattern></defs>
<rect x="6" y="6" width="748" height="510" rx="20" fill="#FBFAF5" stroke="#DEE2DE" stroke-width="1.5"/>
<rect x="6" y="6" width="748" height="510" rx="20" fill="url(#grid)"/>
<text x="44" y="58" font-size="24" font-weight="700" fill="#2C2C2C">How Literary Garden works</text>
<text x="44" y="84" font-size="14.5" fill="#6B7280">From the files your Kindle already keeps to a garden you visit each morning.</text>
<line x1="44" y1="104" x2="716" y2="104" stroke="#DEE2DE" stroke-width="1"/>
<line x1="72" y1="150" x2="72" y2="462" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="72" cy="150" r="17" fill="#3B82F6"/>
<text x="72" y="156" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="108" y="146" font-size="16.5" font-weight="600" fill="#2C2C2C">Your Kindle&#x27;s own files</text>
<text x="108" y="167" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B7280">vocab.db (words you looked up) and My Clippings.txt (highlights)</text>
<circle cx="72" cy="228" r="17" fill="#3B82F6"/>
<text x="72" y="234" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="108" y="224" font-size="16.5" font-weight="600" fill="#2C2C2C">An import script reads them</text>
<text x="108" y="245" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B7280">fetches definitions, book covers, and each cover&#x27;s main color</text>
<circle cx="72" cy="306" r="17" fill="#3B82F6"/>
<text x="72" y="312" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="108" y="302" font-size="16.5" font-weight="600" fill="#2C2C2C">It builds a static site</text>
<text x="108" y="323" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B7280">prebuilt pages, no server, everything on your laptop</text>
<circle cx="72" cy="384" r="17" fill="#3B82F6"/>
<text x="72" y="390" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="108" y="380" font-size="16.5" font-weight="600" fill="#2C2C2C">The words bed schedules reviews</text>
<text x="108" y="401" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B7280">spaced repetition surfaces each word before you&#x27;d forget</text>
<circle cx="72" cy="462" r="17" fill="#15803D"/>
<text x="72" y="468" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="108" y="458" font-size="16.5" font-weight="600" fill="#2C2C2C">The scrapbook holds your highlights</text>
<text x="108" y="479" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B7280">browse, and export any passage as a watercolor card</text>
<text x="716" y="462" font-size="12" font-style="italic" fill="#9aa0a6" text-anchor="end">private by default, nothing leaves your laptop</text>
</svg>